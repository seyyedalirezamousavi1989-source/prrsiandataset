name: Dataset validation

on:
  push:
    paths:
      - "data/staging/**/*.jsonl"
      - "scripts/validate_dataset.py"
      - "schemas/conversation.schema.json"
      - "config/taxonomy_exceptions_v1.json"
      - "tests/**"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "data/staging/**/*.jsonl"
      - "scripts/validate_dataset.py"
      - "schemas/conversation.schema.json"
      - "tests/**"
      - ".github/workflows/validate-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate all staging JSONL files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          shopt -s globstar nullglob
          files=(data/staging/**/*.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "No staging JSONL files found"
            exit 1
          fi
          python scripts/validate_dataset.py "${files[@]}" --json-report reports/staging_validation.json
      - name: Enforce Taxonomy V2 on current Persian excellence batches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/staging/persian_language_excellence_v4.jsonl data/staging/persian_language_excellence_v5_part*.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "No current Persian excellence batches found"
            exit 1
          fi
          python scripts/validate_dataset.py --strict-taxonomy --taxonomy-exceptions config/taxonomy_exceptions_v1.json "${files[@]}"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-validation-report
          path: reports/staging_validation.json
          if-no-files-found: ignore

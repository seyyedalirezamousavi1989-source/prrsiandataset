name: Dataset validation

on:
  push:
    paths:
      - "data/staging/**/*.jsonl"
      - "scripts/validate_dataset.py"
      - "scripts/propose_semantic_families.py"
      - "scripts/build_semantic_review_register.py"
      - "scripts/build_unmatched_record_inventory.py"
      - "scripts/build_taxonomy_coverage_report.py"
      - "scripts/build_legacy_taxonomy_mapping.py"
      - "scripts/build_sample_taxonomy_adjudication.py"
      - "docs/PERSIAN_DATASET_TAXONOMY_V2.md"
      - "schemas/conversation.schema.json"
      - "config/taxonomy_exceptions_v1.json"
      - "tests/**"
      - ".github/workflows/validate-dataset.yml"
  pull_request:
    paths:
      - "data/staging/**/*.jsonl"
      - "scripts/validate_dataset.py"
      - "schemas/conversation.schema.json"
      - "tests/**"
      - ".github/workflows/validate-dataset.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate all staging JSONL files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          shopt -s globstar nullglob
          files=(data/staging/**/*.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "No staging JSONL files found"
            exit 1
          fi
          python scripts/validate_dataset.py "${files[@]}" --json-report reports/staging_validation.json
      - name: Enforce Taxonomy V2 on current Persian excellence batches
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/staging/persian_language_excellence_v4.jsonl data/staging/persian_language_excellence_v5_part*.jsonl)
          if (( ${#files[@]} == 0 )); then
            echo "No current Persian excellence batches found"
            exit 1
          fi
          python scripts/validate_dataset.py --strict-taxonomy --taxonomy-exceptions config/taxonomy_exceptions_v1.json "${files[@]}"
      - name: Generate semantic-family review candidates
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(data/staging/**/*.jsonl)
          python scripts/propose_semantic_families.py --output reports/semantic_family_candidates.json "${files[@]}"
      - name: Build blank human adjudication register
        run: python scripts/build_semantic_review_register.py --input reports/semantic_family_candidates.json --output reports/SEMANTIC_FAMILY_ADJUDICATION_REGISTER_V1.csv
      - name: Build unmatched-record human review inventory
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(data/staging/**/*.jsonl)
          python scripts/build_unmatched_record_inventory.py --candidates reports/semantic_family_candidates.json --csv-output reports/UNMATCHED_RECORD_HUMAN_REVIEW_V1.csv --summary-output reports/unmatched_record_summary.json "${files[@]}"
      - name: Build descriptive taxonomy coverage report
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(data/staging/**/*.jsonl)
          python scripts/build_taxonomy_coverage_report.py --taxonomy docs/PERSIAN_DATASET_TAXONOMY_V2.md --json-output reports/PERSIAN_TAXONOMY_COVERAGE_V1.json --markdown-output reports/PERSIAN_TAXONOMY_COVERAGE_V1.md "${files[@]}"
      - name: Build historical taxonomy mapping proposal
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(data/staging/**/*.jsonl)
          python scripts/build_legacy_taxonomy_mapping.py --taxonomy docs/PERSIAN_DATASET_TAXONOMY_V2.md --output reports/LEGACY_TAXONOMY_MAPPING_PROPOSAL_V1.csv "${files[@]}"
      - name: Build sample-level historical taxonomy adjudication packet
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(data/staging/**/*.jsonl)
          python scripts/build_sample_taxonomy_adjudication.py --taxonomy docs/PERSIAN_DATASET_TAXONOMY_V2.md --csv-output reports/SAMPLE_LEVEL_TAXONOMY_ADJUDICATION_V1.csv --summary-output reports/sample_level_taxonomy_adjudication_summary.json "${files[@]}"
      - name: Upload validation and semantic review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-validation-and-semantic-review
          path: |
            reports/staging_validation.json
            reports/semantic_family_candidates.json
            reports/SEMANTIC_FAMILY_ADJUDICATION_REGISTER_V1.csv
            reports/UNMATCHED_RECORD_HUMAN_REVIEW_V1.csv
            reports/unmatched_record_summary.json
            reports/PERSIAN_TAXONOMY_COVERAGE_V1.json
            reports/PERSIAN_TAXONOMY_COVERAGE_V1.md
            reports/LEGACY_TAXONOMY_MAPPING_PROPOSAL_V1.csv
            reports/SAMPLE_LEVEL_TAXONOMY_ADJUDICATION_V1.csv
            reports/sample_level_taxonomy_adjudication_summary.json
          if-no-files-found: ignore
